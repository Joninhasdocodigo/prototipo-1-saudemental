<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Acolhe — Bem-estar</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/assets/css/login.css" />
	</head>
	<body>
		<header>
			<div id="logo">
				<img src="/assets/images/logo_acolhe.png" alt="logo 'ACOLHE'" />
				<h2>Acolhe</h2>
			</div>

			<nav aria-label="Navegação principal">
				<a href="../index.html">Início</a>
				<a href="../index.html">Recursos</a>
				<a href="../index.html">Como funciona</a>
			</nav>
		</header>

		<main>
			<div class="login">
				<form>
					<h2>Entrar</h2>
					<div>
						<label for="email">E-mail:</label>
						<input type="email" required />
					</div>
					<div>
						<label for="">Senha:</label>
						<input type="password" required />
					</div>
					<button type="submit">Entrar</button>
				</form>
			</div>
			<hr />
			<div class="cadastro">
				<form>
					<h2>Cadastrar</h2>
					<div>
						<label for="nome">Nome:</label>
						<input type="text" required />
					</div>
					<div>
						<label for="cpf">CPF:</label>
						<input type="number" required />
					</div>
					<div>
						<label for="email">E-mail:</label>
						<input type="email" required />
					</div>
					<div>
						<label for="">Nascimento:</label>
						<input type="date" name="Nascimento" id="Nascimento" />
					</div>
					<div>
						<label for="">Senha:</label>
						<input type="password" required />
					</div>
					<button type="submit">Cadastrar</button>
				</form>
			</div>
		</main>

		<footer>
			<p>• acolhe</p>
			<p>
				Esta plataforma é um modelo acadêmico e não substitui acompanhamento
				psicológico profissional.
			</p>
			<p>Em caso de emergência, ligue 188 (CVV).</p>
			<script src="assets/js/script.js"></script>
		</footer>
	</body>
</html>
